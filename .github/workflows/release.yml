name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (created from this commit if missing)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships an Android SDK, but not necessarily the exact
      # platform and build-tools this project compiles against.
      - name: Ensure SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      # The bundle is what Play needs: new apps cannot be published as an APK.
      # The APKs stay for the DHU and for direct installs.
      - name: Build APKs and bundle
        run: ./gradlew :projected:assembleRelease :projected:assembleDebug :projected:bundleRelease

      - name: Verify release signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            projected/build/outputs/apk/release/projected-release.apk

      - name: Stage artifacts
        id: stage
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp projected/build/outputs/apk/release/projected-release.apk \
             "out/car-probe-auto-$TAG-release.apk"
          cp projected/build/outputs/apk/debug/projected-debug.apk \
             "out/car-probe-auto-$TAG-debug.apk"
          cp projected/build/outputs/bundle/release/projected-release.aab \
             "out/car-probe-auto-$TAG.aab"
          ls -la out

      # gh is preinstalled on the runner, so publishing needs no extra action.
      # --clobber keeps re-runs on an existing tag idempotent.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.stage.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* \
              --title "Car Probe $TAG" \
              --notes-file .github/release-notes.md
          fi
          gh release view "$TAG" --json url,assets
